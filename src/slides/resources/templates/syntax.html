<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<h1 th:text="${product.name}">Name</h1>

<p th:if="${product.price > 7}">Premium-Pizza</p>

<ul>
    <li th:each="p : ${products}">
        <a th:href="@{/web/products/{id}(id=${p.id})}"
           th:text="${p.name}">Pizza</a>
    </li>
</ul>

<span th:text="${#numbers.formatCurrency(product.price)}">
</span>
</body>
</html>
