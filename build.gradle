plugins {
    id 'application'
    id 'com.github.ben-manes.versions' version '0.51.0'
}

group = 'de.codevibe'
version = '005'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'pizza.PizzaApp'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.github.freva:ascii-table:1.12.1'
}