plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.ben-manes.versions' version '0.51.0'
}

group = 'de.codevibe'
version = '080'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web tier: embedded Tomcat, Spring MVC, Jackson (all auto-configured).
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Thymeleaf view resolution (TemplateResolver -> Engine -> ViewResolver) auto-configured.
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    // JDBC + DataSource auto-configuration (embedded H2 picked up below).
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    runtimeOnly 'com.h2database:h2'
    // ASCII table rendering for the CLI runners (not managed by the Boot BOM).
    implementation 'com.github.freva:ascii-table:1.12.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
