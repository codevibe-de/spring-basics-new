plugins {
    id 'application'
    id 'war'
    id 'com.github.ben-manes.versions' version '0.51.0'
}

group = 'de.codevibe'
version = '077'

ext {
    springVersion = '6.2.15'
    thymeleafVersion = '3.1.5.RELEASE'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'pizza.PizzaApp'
}

repositories {
    mavenCentral()
}

// Retain method parameter names so Spring MVC can bind @PathVariable / @RequestParam
// without explicit names (Spring Boot enables this by default).
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

dependencies {
    implementation "org.springframework:spring-context:${springVersion}"
    implementation "org.springframework:spring-test:${springVersion}"
    implementation "org.springframework:spring-jdbc:${springVersion}"
    implementation "org.springframework:spring-webmvc:${springVersion}"
    implementation "org.thymeleaf:thymeleaf:${thymeleafVersion}"
    implementation "org.thymeleaf:thymeleaf-spring6:${thymeleafVersion}"
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter-engine'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.h2database:h2:2.4.240'
    implementation 'com.github.freva:ascii-table:1.12.1'
}

test {
    useJUnitPlatform()
}